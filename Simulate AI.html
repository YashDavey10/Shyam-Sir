<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMULATE.AI — What-If Business Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            appbg: '#F7F9FC',
            appcard: '#FFFFFF',
            primaryblue: '#2563EB',
            appteal: '#0D9488',
            lightblue: '#EAF4FF',
            palemint: '#E6F8EF',
            lightlavender: '#F0EDFF',
            maintext: '#263449',
            sectext: '#64748B',
            posgreen: '#15803D',
            warnamber: '#D97706',
            riskred: '#DC2626'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX in-browser compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #F7F9FC;
      color: #263449;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    /* Subtle card hover animation */
    .hover-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.08);
    }
  </style>
</head>
<body class="bg-appbg text-maintext min-h-screen">
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- API HELPER UTILITIES ---
    const API = {
      async getHealth() {
        const res = await fetch('/api/health');
        return res.json();
      },
      async getMetadata() {
        const res = await fetch('/api/metadata');
        return res.json();
      },
      async getDataQuality() {
        const res = await fetch('/api/data-quality');
        return res.json();
      },
      async getScenarios() {
        const res = await fetch('/api/scenarios');
        return res.json();
      },
      async getScenario(id) {
        const res = await fetch(`/api/scenarios/${id}`);
        return res.json();
      },
      async runSimulation(payload) {
        const res = await fetch('/api/simulate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        return res.json();
      },
      async compareScenarios(ids) {
        const res = await fetch('/api/scenarios/compare', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scenario_ids: ids })
        });
        return res.json();
      },
      async queryCopilot(prompt, activeScenarioId) {
        const res = await fetch('/api/copilot/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, active_scenario_id: activeScenarioId })
        });
        return res.json();
      },
      async getRecommendations() {
        const res = await fetch('/api/recommendations');
        return res.json();
      },
      async exportScenario(id) {
        const res = await fetch(`/api/export/${id}`);
        return res.json();
      },
      async resetToDefaults() {
        const res = await fetch('/api/reset', { method: 'POST' });
        return res.json();
      }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [activeScenarioId, setActiveScenarioId] = useState('scen-status-quo');
      const [activeResult, setActiveResult] = useState(null);
      const [allScenarios, setAllScenarios] = useState([]);
      const [loading, setLoading] = useState(true);
      const [simulating, setSimulating] = useState(false);
      const [simProgress, setSimProgress] = useState(0);
      const [dataQuality, setDataQuality] = useState(null);
      const [metadata, setMetadata] = useState(null);
      const [bannerDismissed, setBannerDismissed] = useState(false);

      // Fetch initial scenarios and data quality
      useEffect(() => {
        loadInitialData();
      }, []);

      const loadInitialData = async () => {
        setLoading(true);
        try {
          const [scens, dq, meta] = await Promise.all([
            API.getScenarios(),
            API.getDataQuality(),
            API.getMetadata()
          ]);
          setAllScenarios(scens);
          setDataQuality(dq);
          setMetadata(meta);

          // Select first or default scenario
          const defaultId = scens.length > 0 ? scens[0].id : 'scen-status-quo';
          setActiveScenarioId(defaultId);
          const res = await API.getScenario(defaultId);
          setActiveResult(res);
        } catch (err) {
          console.error("Error loading initial data:", err);
        } finally {
          setLoading(false);
        }
      };

      const selectScenario = async (id) => {
        setActiveScenarioId(id);
        setLoading(true);
        try {
          const res = await API.getScenario(id);
          setActiveResult(res);
        } catch (err) {
          console.error("Failed to load scenario:", err);
        } finally {
          setLoading(false);
        }
      };

      const triggerSimulation = async (assumptionPayload) => {
        setSimulating(true);
        setSimProgress(15);
        const timer1 = setTimeout(() => setSimProgress(45), 200);
        const timer2 = setTimeout(() => setSimProgress(80), 400);

        try {
          const result = await API.runSimulation(assumptionPayload);
          setSimProgress(100);
          setTimeout(async () => {
            setActiveResult(result);
            setActiveScenarioId(result.scenario_id);
            const scens = await API.getScenarios();
            setAllScenarios(scens);
            setSimulating(false);
            setSimProgress(0);
          }, 350);
        } catch (err) {
          console.error("Simulation failed:", err);
          setSimulating(false);
          setSimProgress(0);
        }
      };

      // Quick 20% Growth Action Button
      const handleQuick20Percent = () => {
        triggerSimulation({
          name: "Management 20% Demand Test (Status Quo)",
          description: "One-click test evaluating whether current resources can support 20% sales expansion.",
          sales_growth_pct: 20.0,
          asp_change_pct: 0.0,
          additional_hiring_count: 0,
          allow_overtime: false,
          additional_shifts: 0,
          outsource_logistics: false,
          buffer_inventory_units: 0
        });
      };

      return (
        <div className="flex h-screen overflow-hidden bg-appbg">
          {/* SIDEBAR NAVIGATION */}
          <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} bg-appcard border-r border-slate-200 flex flex-col transition-all duration-300 z-30`}>
            {/* Brand Header */}
            <div className="h-16 flex items-center justify-between px-4 border-b border-slate-100">
              <div className="flex items-center space-x-3 overflow-hidden">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-primaryblue to-appteal flex items-center justify-center text-white font-bold shadow-md shadow-blue-500/20">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                </div>
                {!sidebarCollapsed && (
                  <div>
                    <h1 className="font-extrabold text-base tracking-tight text-maintext leading-tight">SIMULATE<span className="text-primaryblue">.AI</span></h1>
                    <p className="text-[10px] text-sectext font-medium uppercase tracking-wider">What-If Simulator</p>
                  </div>
                )}
              </div>
              <button 
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
                title="Toggle Sidebar"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={sidebarCollapsed ? "M13 5l7 7-7 7M5 5l7 7-7 7" : "M11 19l-7-7 7-7M19 19l-7-7 7-7"} />
                </svg>
              </button>
            </div>

            {/* Quick 20% Action Card */}
            {!sidebarCollapsed && (
              <div className="p-3 mx-3 my-3 bg-lightblue rounded-xl border border-blue-100 shadow-sm">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-xs font-bold text-primaryblue flex items-center">
                    <span className="w-2 h-2 rounded-full bg-primaryblue animate-ping mr-1.5 inline-block"></span>
                    Strategic Target
                  </span>
                  <span className="text-[11px] font-semibold text-blue-700 bg-white px-2 py-0.5 rounded-md border border-blue-200">+20% Sales</span>
                </div>
                <p className="text-[11px] text-slate-600 mb-2 leading-relaxed">Test feasibility of 20% sales growth against existing resources.</p>
                <button
                  onClick={handleQuick20Percent}
                  className="w-full py-2 px-3 bg-primaryblue hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm shadow-blue-500/20 transition-all flex items-center justify-center space-x-1.5"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span>Simulate 20% Growth</span>
                </button>
              </div>
            )}

            {/* Navigation Menu */}
            <nav className="flex-1 px-3 py-2 space-y-1 overflow-y-auto custom-scrollbar">
              {[
                { id: 'dashboard', label: 'Executive Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                { id: 'builder', label: 'Scenario Builder', icon: 'M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4' },
                { id: 'workforce', label: 'Workforce Capacity', icon: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z' },
                { id: 'inventory', label: 'Supply Chain & Inventory', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4' },
                { id: 'operations', label: 'Production & Ops', icon: 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z' },
                { id: 'financial', label: 'Financial Impact', icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' },
                { id: 'comparison', label: 'Scenario Comparison', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
                { id: 'copilot', label: 'AI Scenario Copilot', icon: 'M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z' },
                { id: 'datahub', label: 'Reports & Data Hub', icon: 'M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === item.id 
                      ? 'bg-lightblue text-primaryblue font-bold shadow-xs' 
                      : 'text-slate-600 hover:text-maintext hover:bg-slate-100/70'
                  }`}
                  title={item.label}
                >
                  <svg className={`w-4 h-4 flex-shrink-0 ${activeTab === item.id ? 'text-primaryblue' : 'text-slate-400'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon} />
                  </svg>
                  {!sidebarCollapsed && <span>{item.label}</span>}
                </button>
              ))}
            </nav>

            {/* Data Quality & System Indicator */}
            {!sidebarCollapsed && dataQuality && (
              <div className="p-3 border-t border-slate-100 bg-slate-50/70">
                <div className="flex items-center justify-between text-[11px] mb-1">
                  <span className="text-sectext font-medium">Data Quality Score</span>
                  <span className={`font-bold ${dataQuality.overall_score_pct >= 90 ? 'text-posgreen' : 'text-warnamber'}`}>
                    {dataQuality.overall_score_pct}%
                  </span>
                </div>
                <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden mb-2">
                  <div 
                    className={`h-full rounded-full ${dataQuality.overall_score_pct >= 90 ? 'bg-posgreen' : 'bg-warnamber'}`} 
                    style={{ width: `${dataQuality.overall_score_pct}%` }}
                  ></div>
                </div>
                <div className="flex items-center justify-between text-[10px] text-slate-500">
                  <span className="flex items-center">
                    <span className="w-1.5 h-1.5 rounded-full bg-posgreen mr-1"></span>
                    8 Agents Active
                  </span>
                  <span className="bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded text-[9px] font-mono">v1.0</span>
                </div>
              </div>
            )}
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* TOP BAR */}
            <header className="h-16 bg-appcard border-b border-slate-200 px-6 flex items-center justify-between z-20">
              <div className="flex items-center space-x-4">
                <span className="text-xs font-semibold uppercase tracking-wider text-sectext">Active Scenario:</span>
                <select
                  value={activeScenarioId}
                  onChange={(e) => selectScenario(e.target.value)}
                  className="bg-slate-50 border border-slate-200 text-maintext text-xs rounded-lg px-3 py-1.5 font-semibold focus:outline-none focus:ring-2 focus:ring-primaryblue focus:border-transparent transition-all"
                >
                  {allScenarios.map(s => (
                    <option key={s.id} value={s.id}>
                      {s.name} ({s.growth_pct >= 0 ? `+${s.growth_pct}%` : `${s.growth_pct}%`} Growth)
                    </option>
                  ))}
                </select>

                {activeResult && (
                  <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${
                    activeResult.is_feasible 
                      ? 'bg-palemint text-posgreen border border-green-200' 
                      : 'bg-red-50 text-riskred border border-red-200'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${activeResult.is_feasible ? 'bg-posgreen' : 'bg-riskred'}`}></span>
                    {activeResult.is_feasible ? 'Feasible Plan' : `Infeasible: ${activeResult.primary_bottleneck}`}
                  </span>
                )}
              </div>

              <div className="flex items-center space-x-3">
                <button
                  onClick={() => setActiveTab('builder')}
                  className="px-3.5 py-2 bg-primaryblue hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-sm shadow-blue-500/20 transition-all flex items-center space-x-1.5"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                  </svg>
                  <span>Edit Assumptions</span>
                </button>

                <button
                  onClick={() => setActiveTab('comparison')}
                  className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-all flex items-center space-x-1"
                >
                  <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                  </svg>
                  <span>Compare (3+)</span>
                </button>
              </div>
            </header>

            {/* CALCULATION PROGRESS INDICATOR */}
            {simulating && (
              <div className="w-full bg-blue-100 h-1 overflow-hidden">
                <div 
                  className="bg-primaryblue h-full transition-all duration-300 ease-out"
                  style={{ width: `${simProgress}%` }}
                ></div>
              </div>
            )}

            {/* MANDATORY NOTICE BANNER */}
            {!bannerDismissed && (
              <div className="bg-amber-50 border-b border-amber-200 px-6 py-2 flex items-center justify-between text-xs text-amber-900">
                <div className="flex items-center space-x-2">
                  <svg className="w-4 h-4 text-warnamber flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                    <path fillRule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clipRule="evenodd" />
                  </svg>
                  <span className="font-semibold">Synthetic Demonstration Data — Not Actual Company Results</span>
                  <span className="text-amber-700 font-normal">| Live Connectors: ERP & HRIS are currently <span className="font-bold underline">Not Connected</span>.</span>
                </div>
                <button 
                  onClick={() => setBannerDismissed(true)}
                  className="text-amber-700 hover:text-amber-950 text-xs font-semibold px-2 py-0.5 rounded hover:bg-amber-100"
                >
                  Dismiss
                </button>
              </div>
            )}

            {/* DYNAMIC TAB VIEW CONTAINER */}
            <main className="flex-1 overflow-y-auto p-6 custom-scrollbar bg-appbg">
              {loading && !activeResult ? (
                <div className="flex items-center justify-center h-full">
                  <div className="text-center">
                    <div className="w-12 h-12 border-4 border-primaryblue border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                    <p className="text-xs font-semibold text-sectext">Calculating deterministic scenario models...</p>
                  </div>
                </div>
              ) : (
                <div>
                  {activeTab === 'dashboard' && <ExecutiveDashboard result={activeResult} onTrigger20={handleQuick20Percent} onNavigate={setActiveTab} />}
                  {activeTab === 'builder' && <ScenarioBuilder activeResult={activeResult} onSimulate={triggerSimulation} onSelect={selectScenario} />}
                  {activeTab === 'workforce' && <WorkforcePlanner result={activeResult} onSimulate={triggerSimulation} />}
                  {activeTab === 'inventory' && <InventorySupplySimulator result={activeResult} onSimulate={triggerSimulation} />}
                  {activeTab === 'operations' && <ProductionOperationsPlanner result={activeResult} onSimulate={triggerSimulation} />}
                  {activeTab === 'financial' && <FinancialImpactAnalysis result={activeResult} />}
                  {activeTab === 'comparison' && <ScenarioComparisonView onSelect={selectScenario} />}
                  {activeTab === 'copilot' && <AICopilotView activeResult={activeResult} />}
                  {activeTab === 'datahub' && <ReportsDataHub metadata={metadata} dataQuality={dataQuality} activeResult={activeResult} onReset={loadInitialData} />}
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    // =========================================================================
    // PAGE 1: EXECUTIVE SIMULATION DASHBOARD
    // =========================================================================
    function ExecutiveDashboard({ result, onTrigger20, onNavigate }) {
      if (!result) return null;
      const { assumptions, demand, workforce, operations, finance, risk } = result;

      return (
        <div className="space-y-6">
          {/* Executive Header Banner */}
          <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2 mb-1">
                <span className="text-xs font-bold text-primaryblue tracking-wider uppercase">Strategic Decision Simulation</span>
                <span className="text-slate-300">•</span>
                <span className="text-xs text-sectext">NovaManufacturing Ltd.</span>
              </div>
              <h2 className="text-2xl font-bold text-maintext tracking-tight">{assumptions.name}</h2>
              <p className="text-xs text-sectext mt-1 max-w-2xl">{assumptions.description}</p>
            </div>

            <div className="flex items-center space-x-3">
              <button

    function AICopilotView({ activeResult }) {
      const [messages, setMessages] = useState([
        {
          sender: 'assistant',
          text: `Welcome to the SIMULATE.AI Scenario Copilot. I am your strategic decision advisor, grounded directly in the deterministic simulation of "${activeResult?.assumptions?.name || 'Active Scenario'}". Ask me any operational or financial question!`,
          binding_constraint: activeResult?.operations?.binding_constraint,
          recommendations: [
            "Ask about binding bottlenecks",
            "Ask why profit grows slower than revenue",
            "Ask whether hiring or overtime is preferable"
          ]
        }
      ]);
      const [input, setInput] = useState('');
      const [copilotLoading, setCopilotLoading] = useState(false);
      const messagesEndRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages]);

      const handleSend = async (queryText) => {
        const text = queryText || input;
        if (!text.trim()) return;

        const newMsg = { sender: 'user', text };
        setMessages(prev => [...prev, newMsg]);
        setInput('');
        setCopilotLoading(true);

        try {
          const resp = await API.queryCopilot(text, activeResult?.scenario_id);
          setMessages(prev => [...prev, {
            sender: 'assistant',
            text: resp.answer,
            binding_constraint: resp.binding_constraint,
            tradeoffs: resp.key_tradeoffs,
            recommendations: resp.actionable_recommendations,
            source: resp.source
          }]);
        } catch (err) {
          console.error("Copilot error:", err);
          setMessages(prev => [...prev, {
            sender: 'assistant',
            text: "Could not retrieve copilot response. Falling back to deterministic summary.",
            source: "offline-fallback"
          }]);
        } finally {
          setCopilotLoading(false);
        }
      };

      const suggestedPrompts = [
        "Can we achieve 20% sales growth without hiring?",
        "Which resource becomes the first bottleneck?",
        "Why does profit grow more slowly than revenue?",
        "Compare hiring with overtime.",
        "How much extra working capital will we need?",
        "What if demand increases by 30%?"
      ];

      return (
        <div className="h-[calc(100vh-130px)] flex flex-col bg-appcard rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          {/* Header */}
          <div className="p-4 border-b border-slate-200 bg-slate-50/70 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-primaryblue to-appteal flex items-center justify-center text-white font-bold shadow-xs">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
              </div>
              <div>
                <h3 className="text-sm font-bold text-maintext">AI Strategic Scenario Copilot</h3>
                <p className="text-[11px] text-sectext">Grounded in verified simulation outputs for: <span className="font-semibold text-primaryblue">{activeResult?.assumptions?.name}</span></p>
              </div>
            </div>
            <span className="text-[10px] font-semibold bg-palemint text-posgreen px-2.5 py-1 rounded-full border border-green-200">
              Zero Arithmetic Fabrication Mode
            </span>
          </div>

          {/* Chat Messages */}
          <div className="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar bg-slate-50/30">
            {messages.map((m, i) => (
              <div key={i} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-2xl rounded-2xl p-4 shadow-2xs text-xs leading-relaxed ${
                  m.sender === 'user' 
                    ? 'bg-primaryblue text-white rounded-br-none' 
                    : 'bg-white text-maintext border border-slate-200 rounded-bl-none'
                }`}>
                  <div className="font-sans whitespace-pre-line">{m.text}</div>

                  {m.binding_constraint && (
                    <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center space-x-1.5 text-[11px]">
                      <span className="font-bold text-sectext">Binding Constraint:</span>
                      <span className="font-semibold text-riskred">{m.binding_constraint}</span>
                    </div>
                  )}

                  {m.tradeoffs && m.tradeoffs.length > 0 && (
                    <div className="mt-2.5 pt-2 border-t border-slate-100">
                      <span className="font-bold text-[11px] text-slate-700 block mb-1">Key Strategic Trade-offs:</span>
                      <ul className="list-disc pl-4 space-y-0.5 text-slate-600 text-[11px]">
                        {m.tradeoffs.map((t, tidx) => <li key={tidx}>{t}</li>)}
                      </ul>
                    </div>
                  )}

                  {m.recommendations && m.recommendations.length > 0 && (
                    <div className="mt-2.5 pt-2 border-t border-slate-100">
                      <span className="font-bold text-[11px] text-primaryblue block mb-1">Actionable Recommendations:</span>
                      <ul className="list-disc pl-4 space-y-0.5 text-slate-600 text-[11px]">
                        {m.recommendations.map((r, ridx) => <li key={ridx}>{r}</li>)}
                      </ul>
                    </div>
                  )}

                  {m.source && (
                    <span className="block mt-2 text-[9px] text-slate-400 font-mono text-right">
                      Source: {m.source}
                    </span>
                  )}
                </div>
              </div>
            ))}
            {copilotLoading && (
              <div className="flex justify-start">
                <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs flex items-center space-x-2 text-xs text-sectext">
                  <div className="w-4 h-4 border-2 border-primaryblue border-t-transparent rounded-full animate-spin"></div>
                  <span>Analyzing simulation trade-offs...</span>
                </div>

          >
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Ask about bottlenecks, financial trade-offs, hiring vs overtime, or risk..."
              className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-maintext focus:outline-none focus:ring-2 focus:ring-primaryblue"
            />
            <button
              type="submit"
              disabled={copilotLoading || !input.trim()}
              className="px-4 py-2.5 bg-primaryblue hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center space-x-1"
            >
              <span>Ask</span>
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </button>
          </form>
        </div>
      );

          const rep = await API.exportScenario(activeResult.scenario_id);
          setExportData(rep);
        } catch (err) {
          console.error("Export error:", err);
        } finally {
          setExporting(false);
        }
      };

      const downloadJson = () => {
        if (!exportData) return;
        const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SIMULATE_AI_${activeResult.scenario_id}.json`;
        a.click();
      };

      return (
        <div className="space-y-6">
          <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <h2 className="text-xl font-bold text-maintext">Simulation Reports, Data Ingestion & Governance Hub</h2>
              <p className="text-xs text-sectext mt-0.5">Manage data sources, inspect schema audit scores, export executive reports, and review integration status.</p>
            </div>
            <button
              onClick={handleExport}
              className="px-4 py-2 bg-primaryblue hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-xs transition-all flex items-center space-x-2"
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              <span>Generate Audit Report</span>
            </button>
          </div>

          {/* Data Quality Report Card */}
          {dataQuality && (
            <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 className="text-sm font-bold text-maintext">Agent 2 — Data Quality & Integrity Report</h3>
                  <p className="text-xs text-sectext">Pre-flight validation across {dataQuality.total_records_checked} fields in all 6 departmental tables.</p>
                </div>
                <span className={`text-base font-extrabold px-3 py-1 rounded-xl ${
                  dataQuality.overall_score_pct >= 90 ? 'bg-palemint text-posgreen' : 'bg-amber-100 text-warnamber'
                }`}>
                  {dataQuality.overall_score_pct}% Overall Score
                </span>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                  <span className="text-sectext block">Completeness</span>
                  <span className="text-lg font-bold text-posgreen">{dataQuality.completeness_score_pct}%</span>
                </div>
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                  <span className="text-sectext block">Validity</span>
                  <span className="text-lg font-bold text-posgreen">{dataQuality.validity_score_pct}%</span>
                </div>
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                  <span className="text-sectext block">Consistency</span>
                  <span className="text-lg font-bold text-posgreen">{dataQuality.consistency_score_pct}%</span>
                </div>
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                  <span className="text-sectext block">Referential Integrity</span>
                  <span className="text-lg font-bold text-posgreen">{dataQuality.integrity_score_pct}%</span>
                </div>
              </div>

              <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700">
                <span className="font-bold text-maintext block mb-1">Quality Assessment Summary:</span>
                {dataQuality.suggested_corrections.map((s, i) => (
                  <p key={i} className="text-slate-600 mt-0.5">• {s}</p>
                ))}
              </div>
            </div>
          )}

          {/* Integration Status & Connectors */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm">
              <h3 className="text-sm font-bold text-maintext mb-2">Live Enterprise Connectors</h3>
              <p className="text-xs text-sectext mb-4">Configurable connectors for real-time ERP, CRM, HRIS, and WMS data.</p>

              <div className="space-y-3">
                {[
                  { name: 'SAP S/4HANA & Oracle ERP', status: 'Not Connected', desc: 'Syncs live COGS, material costs, and invoices.' },
                  { name: 'Salesforce & HubSpot CRM', status: 'Not Connected', desc: 'Ingests pipeline conversions and regional demand forecasts.' },
                  { name: 'Workday HRIS', status: 'Not Connected', desc: 'Extracts real-time headcount, wages, and shift logs.' },
                  { name: 'Manhattan WMS Logistics', status: 'Not Connected', desc: 'Monitors warehouse throughput and fleet availability.' }
                ].map((c, i) => (
                  <div key={i} className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-maintext block">{c.name}</span>
                      <span className="text-[10px] text-sectext">{c.desc}</span>
                    </div>
                    <span className="text-[10px] font-semibold text-slate-500 bg-slate-200 px-2.5 py-1 rounded-md">
                      {c.status}
                    </span>
                  </div>
                ))}
              </div>
            </div>

            {/* Data Source Mode & Audit Reset */}
            <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-maintext mb-2">Active Data Mode</h3>
                <p className="text-xs text-sectext mb-4">Currently running in transparent demonstration mode with NovaManufacturing Ltd.</p>

                <div className="p-4 bg-lightblue rounded-xl border border-blue-100 mb-4">
                  <div className="flex items-center space-x-2 text-xs font-bold text-primaryblue mb-1">
                    <span className="w-2 h-2 rounded-full bg-primaryblue"></span>
                    <span>Synthetic Demonstration Data</span>
                  </div>
                  <p className="text-[11px] text-slate-600 leading-relaxed">
                    Connected datasets: 3 precision products, 24 months historical demand, 42 employees across 3 departments, 3 production lines, and verified financial P&L.
                  </p>
                </div>
              </div>

              <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                <span className="text-xs text-sectext">Restore original demonstration state:</span>
                <button
                  onClick={onReset}
                  className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-all"
                >
                  Reset All Scenarios
                </button>
              </div>
            </div>
          </div>

          {/* Export Report Modal/View if generated */}
          {exportData && (
            <div className="bg-appcard rounded-2xl p-6 border border-slate-200 shadow-sm">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h3 className="text-sm font-bold text-maintext">{exportData.report_title}</h3>
                  <p className="text-xs text-sectext">Generated at: {exportData.generation_timestamp}</p>
                </div>
                <button
                  onClick={downloadJson}
                  className="px-3.5 py-1.5 bg-primaryblue hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow-2xs flex items-center space-x-1.5"
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  <span>Download JSON Report</span>
                </button>
              </div>
              <pre className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-[11px] font-mono text-slate-700 overflow-x-auto max-h-60 custom-scrollbar">
                {JSON.stringify(exportData, null, 2)}
              </pre>
            </div>
          )}
        </div>
      );
    }

    // Render App to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
